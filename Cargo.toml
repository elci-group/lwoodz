[package]
name = "lwoodz"
version = "0.3.10"
edition = "2021"
description = "Lwoodz is to license document generation and maintenance what Kaptaind is to version management — the canonical licensing daemon for a repository."
license = "MIT"
repository = "https://github.com/elci-group/lwoodz"
keywords = ["license", "spdx", "compliance", "daemon", "legal"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
rust-version = "1.75"

[[bin]]
name = "lwoodz"
path = "src/main.rs"

[[bin]]
name = "lwoodz-cli"
path = "src/bin/cli.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "6"
walkdir = "2"
regex = "1"
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
semver = "1"
dirs = "5"
clap_complete = "4"
form3 = { path = "../3form" }

[dev-dependencies]
tempfile = "3"
clap_mangen = "0.2"
